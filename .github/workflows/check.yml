name: Check

# Every branch but master (which deploy.yml builds and publishes): unit tests, the production
# build, and the scenarios in e2e/ on a phone-sized Chromium against the Firestore emulator
# with the branch's rules. Screenshots and the report are kept as the "e2e" artifact.
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # The production bundle, talking to the emulator instead of the real project.
      - run: npx ng build -c production,emulator
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end scenarios
        run: >-
          npx -y firebase-tools@15 emulators:exec --only firestore
          --project demo-football-league "cd e2e && npx playwright test"
        env:
          CI: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e/screenshots
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
