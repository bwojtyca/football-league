@let current = league();
<fl-top-bar [title]="current?.name ?? ''" [switcher]="leagueId()">
  @if (current && !current.archived) {
    <button
      matIconButton
      (click)="addPlayer()"
      [attr.aria-label]="'league.addPlayer' | transloco"
      [matTooltip]="'league.addPlayer' | transloco"
    >
      <mat-icon>person_add</mat-icon>
    </button>
  }
</fl-top-bar>

<!-- On a wide screen (P80): the ranking on the left, what is going on in the league on the right. -->
<main class="page home">
  @if (!current || !ranking()) {
    <fl-skeleton class="skeleton" />
  } @else {
    <aside class="side">
      @if (current.archived) {
        <p class="note">
          {{ 'league.lockedNote' | transloco }}
          <a [routerLink]="['/l', current.id, 'settings']">{{ 'settings.title' | transloco }}</a>
        </p>
      } @else {
        <fl-now-card [leagueId]="current.id" />
      }
    </aside>

    <section class="main">
      @if (!canPlay() && !current.archived) {
        <p class="empty">{{ 'league.noPlayers' | transloco }}</p>
      }
      <fl-ranking
        [players]="ranking()!"
        [games]="games()"
        [minGames]="current.minGames ?? 0"
        [playerLink]="playerLink"
        [titles]="titles()"
      />
    </section>
  }
</main>
